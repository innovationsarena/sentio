# ─────────────────────────────────────────────────────────────────────────────
# Sentio SMTP - OSS quickstart docker-compose stack
#
#   docker compose up -d          # pull the published image + start everything
#   docker compose logs -f sentio # tail app logs
#   docker compose down -v        # stop and wipe volumes
#
# What runs:
#   sentio         - the SMTP + REST API server (ports 25, 465, 587, 8080)
#   sentio-migrate - one-shot: applies DB migrations + seeds bootstrap tenant
#   postgres       - application state (tenants, messages, credentials, …)
#   redis          - KV backend (rate limits, greylist, bans, rspamd Bayes)
#   nats           - JetStream (queue + delivery pipeline)
#   minio          - S3-compatible blob storage for raw .eml / attachments
#   minio-init     - one-shot: creates the sentio-attachments bucket
#   clamav         - antivirus (attachment scanning, port 3310)
#   rspamd         - spam scorer (port 11333)
#
# Bootstrap credentials (the seed migration auto-seeds these):
#   Tenant ID : 00000000-0000-0000-0000-000000000001 ("Sentio Platform")
#   API key   : sentio_bootstrap_admin_CHANGE_ME
#
# ⚠ Rotate the API key immediately if this host is reachable from the
#   internet. See README-docker.md.
#
# DNS / DNSBL note:
#   Sentio and rspamd use Docker's embedded DNS by default. Spamhaus
#   (zen.spamhaus.org, dbl.spamhaus.org) refuses queries from shared public
#   resolvers and will return 127.255.255.254 under real volume. For
#   production, either (a) register a free Spamhaus Data Query Service key
#   and rewrite the DNSBL lists to use <key>.zen.dq.spamhaus.net, or
#   (b) add an unbound recursive resolver service and point everything at it.
#
# ── LOCAL: config baked into images instead of bind-mounted ──────────────────
#   nats, minio-init and rspamd build thin local images that COPY their config
#   in. Coolify rewrites relative bind mounts to a host path under
#   /data/coolify/applications/<uuid>/ but does not check the repo files out
#   there, so Docker auto-created empty DIRECTORIES named nats-server.conf and
#   init.sh, and nats died with "not a directory". Building removes the
#   dependency on host state entirely.
#   See docker/{nats,minio,rspamd}/Dockerfile
# ─────────────────────────────────────────────────────────────────────────────

name: sentio-oss

x-sentio-env: &sentio-env
  RUST_LOG: info
  SENTIO__SERVER__HOSTNAME: "${SENTIO_HOSTNAME}"
  SENTIO__DATABASE__URL: "postgres://sentio:${POSTGRES_PASSWORD}@postgres:5432/sentio"
  SENTIO__KV__BACKEND: "redis"
  SENTIO__REDIS__URL: "redis://redis:6379/0"
  SENTIO__NATS__URL: "nats://nats:4222"
  SENTIO__STORAGE__ENDPOINT_URL: "http://minio:9000"
  SENTIO__STORAGE__ACCESS_KEY: "${MINIO_USER}"
  SENTIO__STORAGE__SECRET_KEY: "${MINIO_PASSWORD}"
  SENTIO__STORAGE__BUCKET: "sentio-attachments"
  SENTIO__SCANNING__CLAMD_HOST: "clamav:3310"
  SENTIO__SPAM__RSPAMD__URL: "http://rspamd:11333"

services:
  # ── Data plane ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentio
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: sentio
    volumes:
      # PG18+ images store data in a major-version subdirectory and reject a
      # mount at /var/lib/postgresql/data. Mount the parent instead.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentio -d sentio"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [sentio_net]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sentio_net]

  nats:
    # LOCAL: was `image: nats:2.11-alpine` + bind mount of nats-server.conf
    build:
      context: ./docker/nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - nats_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sentio_net]

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sentio_net]

  minio-init:
    # LOCAL: was `image: quay.io/minio/mc:latest` + bind mount of init.sh
    build:
      context: ./docker/minio
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_URL: "http://minio:9000"
      MINIO_ROOT_USER: "${MINIO_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD}"
      SENTIO_BUCKET: "sentio-attachments"
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [sentio_net]

  # ── Content scanners ────────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    environment:
      # Signature checks per day. The image defaults to 1, which can leave the
      # scanner a full day behind; the feed publishes several times daily.
      FRESHCLAM_CHECKS: "24"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s # freshclam DB download can take a while
    networks: [sentio_net]

  rspamd:
    # LOCAL: was `image: rspamd/rspamd:latest` + bind mount of local.d/
    build:
      context: ./docker/rspamd
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    volumes:
      - rspamd_data:/var/lib/rspamd
    healthcheck:
      test: ["CMD", "rspamadm", "control", "stat"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sentio_net]

  # ── One-shot: run migrations + seed bootstrap tenant + API key ──────────
  sentio-migrate:
    image: ghcr.io/truespar/sentio:${SENTIO_TAG:-latest}
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *sentio-env
    command: ["--config", "/etc/sentio/oss.toml", "migrate"]
    networks: [sentio_net]

  # ── The application ─────────────────────────────────────────────────────
  sentio:
    image: ghcr.io/truespar/sentio:${SENTIO_TAG:-latest}
    restart: unless-stopped
    depends_on:
      sentio-migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
      rspamd: { condition: service_healthy }
    environment:
      <<: *sentio-env
    ports:
      - "25:25" # SMTP MX (edit / remove for laptops behind NAT)
      - "465:465" # SMTPS
      - "587:587" # Submission (STARTTLS)
      # - "9090:9090" # Prometheus metrics - unauth; keep internal
    # LOCAL: these labels live here, not in docker-compose.override.yml -
    # Coolify runs compose with an explicit -f, which stops the override file
    # from being auto-loaded. Delete this block if you set the domain in the
    # Coolify UI instead and let Coolify generate its own labels.
    labels:
      - traefik.enable=true
      - traefik.http.routers.sentio.rule=Host(`${SENTIO_HOSTNAME}`)
      - traefik.http.routers.sentio.entrypoints=https
      - traefik.http.routers.sentio.tls.certresolver=letsencrypt
      - traefik.http.services.sentio.loadbalancer.server.port=8080
    volumes:
      - sentio_data:/var/lib/sentio
      # Mount your own cert bundle at /etc/sentio/tls/ to enable STARTTLS +
      # implicit TLS. Without these files Sentio runs plain SMTP only.
      # - ./tls:/etc/sentio/tls:ro
    networks: [sentio_net]

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
  clamav_data:
  rspamd_data:
  sentio_data:

networks:
  sentio_net:
    driver: bridge
